name: Android CI

on:
  push:

jobs:
  build-release-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      - name: Build release APKs (ABI split)
        run: ./gradlew assembleRelease

      - name: Show generated release APKs
        run: ls -lh app/build/outputs/apk/release/

      - name: Upload arm64-v8a release APK
        uses: actions/upload-artifact@v4
        with:
          name: horizonweb-release-arm64-v8a
          path: app/build/outputs/apk/release/*-arm64-v8a-release*.apk
          if-no-files-found: error

      - name: Upload armeabi-v7a release APK
        uses: actions/upload-artifact@v4
        with:
          name: horizonweb-release-armeabi-v7a
          path: app/build/outputs/apk/release/*-armeabi-v7a-release*.apk
          if-no-files-found: error

      - name: Upload x86 release APK
        uses: actions/upload-artifact@v4
        with:
          name: horizonweb-release-x86
          path: app/build/outputs/apk/release/*-x86-release*.apk
          if-no-files-found: error

      - name: Upload x86_64 release APK
        uses: actions/upload-artifact@v4
        with:
          name: horizonweb-release-x86_64
          path: app/build/outputs/apk/release/*-x86_64-release*.apk
          if-no-files-found: error
